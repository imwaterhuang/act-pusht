[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-wam"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mini_wam.studio" = ["live.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
