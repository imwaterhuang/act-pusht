# L4 measured 2026-09-17: batch 64, 2 workers, 0.0673 s/step.
# 40,000 updates ~= 100 full-data passes; 50 frozen development scenes.
model:
  name: act
  pretrained: true
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  num_latent_layers: 4
  latent_dim: 32
  chunk_size: 16
data:
  dataset_root: data/lerobot/pusht_image
  episode_manifest: splits/act_all_episodes.json
  normalization_path: artifacts/act/data_audit.json
  action_horizon: 16
training:
  seed: 0
  batch_size: 64
  train_steps: 40000
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_steps: 500
  gradient_clip_norm: 1.0
  beta: 10.0
checkpoint:
  frequency: 1000
evaluation:
  enabled: true
  development_scenes: splits/act_development_scenes.json
  frequency: 5000
  max_steps: 300
  execute_steps: 4
